    <style>/* ============================================================
   亚马逊运营工作台 - 全局样式
   风格：浅色 + 品牌蓝，与广告智研舱一致
   ============================================================ */

:root {
  --bg: #f7f6f3;
  --panel: #ffffff;
  --panel-2: #f5f4ef;
  --panel-3: #efede6;
  --ink: #1c1a17;
  --ink-2: #55514a;
  --muted: #8b857b;
  --line: #e9e6df;
  --line-strong: #d8d4c9;
  --accent: #ff9900;
  --accent-weak: #fff4e5;
  --accent-strong: #b45309;
  --accent-alt: #146eb4;
  --accent-alt-weak: #e7eff6;
  --ok: #16a34a;
  --ok-weak: #f0fdf4;
  --warn: #d97706;
  --warn-weak: #fffbeb;
  --down: #dc2626;
  --down-weak: #fef2f2;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.14);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overscroll-behavior-x: none; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 布局 ---------- */
.app-shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
  overscroll-behavior-x: none;
  position: relative;
}

.sidebar {
  width: 236px;
  flex-shrink: 0;
  background: #1d1a15;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  color: #ece7df;
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  transition: width 0.25s ease, margin-left 0.25s ease, padding 0.25s ease;
  overflow: hidden;
}

.app-shell.sidebar-collapsed .sidebar {
  width: 0;
  padding-left: 0;
  padding-right: 0;
  border-right: none;
}

/* 侧边栏收起/展开按钮 */
.sidebar-collapse-btn {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 7px;
  color: #8d8577;
  cursor: pointer;
  flex-shrink: 0;
  margin-left: auto;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}

.sidebar-collapse-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.12); }

.sidebar-collapse-btn svg { width: 15px; height: 15px; }

/* 侧边栏宽度拖拽调节 */
.sidebar-resizer {
  flex-shrink: 0;
  width: 7px;
  margin-left: -7px;
  align-self: stretch;
  position: relative;
  z-index: 5;
  cursor: col-resize;
  touch-action: none;
}

.sidebar-resizer::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 3px;
  width: 1px;
  background: transparent;
  transition: background 0.15s;
}

.sidebar-resizer:hover::after,
.app-shell.sidebar-resizing .sidebar-resizer::after {
  background: var(--accent);
}

.app-shell.sidebar-collapsed .sidebar-resizer {
  display: none;
}

body.sidebar-resizing {
  cursor: col-resize;
  user-select: none;
  -webkit-user-select: none;
}

body.sidebar-resizing .sidebar {
  transition: none;
}

body.sidebar-resizing .main {
  pointer-events: none;
}

.sidebar-expand-btn {
  position: absolute;
  top: 16px;
  left: 10px;
  z-index: 50;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  border-radius: 7px;
  color: var(--ink-2);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}

.sidebar-expand-btn:hover { color: var(--accent); background: var(--accent-weak); }

.sidebar-expand-btn svg { width: 15px; height: 15px; }

.sidebar-overlay {
  display: none;
}

/* 键盘焦点可见性 */
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
a:focus-visible,
iframe:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* hidden 属性必须生效（防止 display:flex 覆盖导致按钮重复显示） */
.sidebar-collapse-btn[hidden],
.sidebar-expand-btn[hidden] {
  display: none !important;
}

.main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-x: none;
  padding: 28px 32px;
}

/* ---------- 品牌 ---------- */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 6px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 12px;
  min-width: 0;
}

.brand-mark {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  color: #fff;
  border-radius: 10px;
  font-size: 18px;
  flex-shrink: 0;
}

.brand-mark img {
  width: 24px;
  height: 24px;
  display: block;
}

.brand-text {
  flex: 1;
  min-width: 0;
}

.brand strong {
  display: block;
  font-size: 15px;
  line-height: 1.35;
  color: #f7f2ea;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.brand small {
  color: #a29a8d;
  font-size: 11px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  word-break: break-word;
  display: block;
}

/* ---------- 导航 ---------- */
.side-nav {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.24) transparent;
}

.side-nav::-webkit-scrollbar { width: 8px; }
.side-nav::-webkit-scrollbar-track { background: transparent; }
.side-nav::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
.side-nav::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

.nav-group {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 12px;
  margin: 2px 0;
  min-width: 0;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13.5px;
  color: #bdb6ab;
  font-weight: 500;
  font-family: inherit;
  text-align: left;
  transition: background 0.15s, color 0.15s;
}

.nav-group svg { width: 17px; height: 17px; flex-shrink: 0; }

.nav-group:hover { background: rgba(255, 255, 255, 0.07); color: #f2ede4; }

.nav-group-label {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.nav-group-caret {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  margin-left: auto;
  transition: transform 0.2s ease;
  opacity: 0.55;
}

.nav-group[aria-expanded="false"] .nav-group-caret {
  transform: rotate(-90deg);
}

.nav-group-items {
  overflow: hidden;
  transition: max-height 0.25s ease, opacity 0.2s ease;
  max-height: 400px;
  opacity: 1;
  padding: 2px 0 6px;
}

.nav-group[aria-expanded="false"] + .nav-group-items {
  max-height: 0;
  opacity: 0;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 12px;
  margin: 2px 0;
  min-width: 0;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  color: #bdb6ab;
  font-size: 13.5px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s, color 0.15s;
}

.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }

.nav-item > span {
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.nav-item:hover { background: rgba(255, 255, 255, 0.07); color: #f2ede4; }

.nav-item.is-active {
  background: rgba(255, 153, 0, 0.18);
  color: #ffc46b;
  font-weight: 600;
}

.nav-badge {
  margin-left: auto;
  flex-shrink: 0;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(217, 119, 6, 0.16);
  color: #fbbf24;
  font-weight: 500;
  white-space: nowrap;
}

.nav-group-items .nav-item {
  padding: 6px 12px 6px 36px;
  gap: 8px;
  font-size: 13px;
  color: #a29a8d;
}

.nav-group-items .nav-item svg {
  width: 15px;
  height: 15px;
}

.nav-group-items .nav-item:hover {
  color: #f2ede4;
}

.nav-group-items .nav-item.is-active {
  color: #ffc46b;
}

.nav-group-items .nav-item.is-active svg {
  color: #ffc46b;
}

.sidebar-foot {
  flex-shrink: 0;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding: 14px 6px 4px;
  font-size: 12px;
  color: #97907f;
}

.sidebar-foot p { margin: 2px 0; }
.sidebar-foot .muted { color: #6f6a5e; font-size: 11px; }

.svc-status { margin-bottom: 8px; }
.svc-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: #97907f;
  margin: 3px 0;
}
.svc-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--line-strong);
  flex-shrink: 0;
}
.svc-dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18); }
.svc-dot.off { background: var(--line-strong); }

/* ---------- 页面头 ---------- */
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.page-head h1 { font-size: 24px; line-height: 1.3; }
.page-head p { color: var(--ink-2); margin-top: 5px; max-width: 680px; font-size: 13.5px; }

.head-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.btn[hidden] { display: none; }

.btn svg { width: 15px; height: 15px; }

.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 1px 2px rgba(255, 153, 0, 0.28), 0 4px 12px rgba(255, 153, 0, 0.18);
}
.btn-primary:hover { background: #e68a00; border-color: #e68a00; color: #fff; box-shadow: 0 2px 4px rgba(180, 83, 9, 0.3), 0 6px 18px rgba(255, 153, 0, 0.24); }

.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--panel-2); color: var(--ink); }

.btn-sm { padding: 5px 11px; font-size: 12px; }

.btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card h2 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card h2 svg { width: 16px; height: 16px; color: var(--accent); }

.card .hint { color: var(--muted); font-size: 12.5px; margin-top: -6px; margin-bottom: 12px; }

/* ---------- 网格 ---------- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-2-product { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

@media (max-width: 1200px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 900px) {
  .grid-2, .grid-2-product, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* ---------- 统计卡片 ---------- */
.stat-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}

.stat-card .label { font-size: 12px; color: var(--muted); }
.stat-card .value { font-size: 27px; font-weight: 700; margin-top: 4px; letter-spacing: 0; }
.stat-card .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

.stat-card.accent { border-top: 3px solid var(--accent); }
.stat-card.ok { border-top: 3px solid var(--ok); }
.stat-card.warn { border-top: 3px solid var(--warn); }
.stat-card.down { border-top: 3px solid var(--down); }

/* ---------- 库存监控 ---------- */
.inventory-summary-shell { margin-bottom: 14px; }

.inventory-notice {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 12px;
  margin-bottom: 10px;
  border: 1px solid #fde68a;
  border-radius: var(--radius-sm);
  background: var(--warn-weak);
  color: #92400e;
  font-size: 12px;
}

.inventory-notice svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  margin-top: 2px;
}

.inventory-total-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 12px 16px;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--ink-2);
}

.inventory-total-row strong {
  color: var(--ink);
  font-size: 19px;
}

.inventory-total-row .muted { margin-left: auto; color: var(--muted); font-size: 12px; }

.inventory-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 12px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  box-shadow: var(--shadow);
}

.inventory-toolbar select,
.inventory-search {
  height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  font-family: inherit;
  font-size: 12.5px;
}

.inventory-toolbar select {
  max-width: 150px;
  padding: 0 28px 0 9px;
}

.inventory-date-picker {
  position: relative;
  flex-shrink: 0;
}

.inventory-date-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 112px;
  max-width: 180px;
  height: 34px;
  padding: 0 9px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  font-family: inherit;
  font-size: 12.5px;
  cursor: pointer;
}

.inventory-date-trigger:hover,
.inventory-date-trigger[aria-expanded="true"] {
  border-color: var(--accent);
}

.inventory-date-trigger svg {
  width: 14px;
  height: 14px;
  color: var(--muted);
  flex-shrink: 0;
}

.inventory-date-menu {
  position: absolute;
  z-index: 30;
  top: calc(100% + 5px);
  left: 0;
  width: 220px;
  max-height: 280px;
  overflow: auto;
  padding: 6px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow-lg);
}

.inventory-date-menu[hidden] {
  display: none;
}

.inventory-date-latest,
.inventory-date-option {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 12.5px;
  text-align: left;
}

.inventory-date-latest {
  justify-content: space-between;
  cursor: pointer;
}

.inventory-date-latest:hover,
.inventory-date-option:hover {
  background: var(--panel-2);
}

.inventory-date-option {
  cursor: pointer;
}

.inventory-date-option input {
  accent-color: var(--accent);
}

.inventory-snapshot-block + .inventory-snapshot-block {
  margin-top: 18px;
}

.inventory-snapshot-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  background: var(--panel-2);
}

.inventory-snapshot-head strong {
  font-size: 13px;
}

.inventory-snapshot-head span {
  color: var(--muted);
  font-size: 11.5px;
}

.inventory-snapshot-block .inventory-table-wrap {
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}

.inventory-search {
  width: 240px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
}

.inventory-search svg {
  width: 14px;
  height: 14px;
  color: var(--muted);
  flex-shrink: 0;
}

.inventory-search input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 12.5px;
}

.inventory-check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
  font-size: 12.5px;
  white-space: nowrap;
}

.inventory-check input { accent-color: var(--accent); }

.inventory-source {
  margin-left: auto;
  color: var(--muted);
  font-size: 11.5px;
  white-space: nowrap;
}

.inventory-table-wrap {
  max-height: calc(100vh - 390px);
  min-height: 360px;
}

.inventory-table td { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.inventory-table .inventory-strong { color: var(--accent-strong); font-weight: 700; }

.link-button {
  border: none;
  background: transparent;
  padding: 0;
  color: var(--accent-alt);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
}

.link-button:hover { color: var(--accent-strong); text-decoration: underline; }

.inventory-pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 2px 2px;
  color: var(--muted);
  font-size: 12px;
}

.inventory-pager-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.inventory-detail-modal { max-width: 1120px; }
.inventory-detail-modal h4 { margin: 18px 0 8px; font-size: 14px; }

.inventory-detail-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 16px 0 12px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel-2);
}

.inventory-detail-tabs button {
  flex: 1;
  min-width: 0;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-2);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.inventory-detail-tabs button span {
  margin-left: 4px;
  color: var(--muted);
  font-weight: 500;
}

.inventory-detail-tabs button.is-active {
  background: var(--panel);
  color: var(--accent-strong);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
}

.inventory-detail-pane[hidden] {
  display: none;
}

.inventory-detail-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  min-height: 34px;
  margin-bottom: 8px;
}

.inventory-detail-toolbar > span {
  color: var(--muted);
  font-size: 12px;
}

.inventory-detail-toolbar label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  color: var(--ink-2);
  font-size: 12px;
}

.inventory-detail-toolbar select {
  height: 32px;
  padding: 0 28px 0 9px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  font-family: inherit;
  font-size: 12px;
}

.inventory-detail-scroll {
  max-height: min(52vh, 560px);
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}

.inventory-detail-scroll thead th {
  position: sticky;
  top: 0;
  z-index: 2;
}

.inventory-shipment-sku-link {
  color: var(--accent-alt);
  white-space: nowrap;
}

.inventory-shipment-sku-mask {
  z-index: 1100;
  background: rgba(15, 23, 42, 0.32);
}

.inventory-shipment-sku-modal {
  max-width: 760px;
}

.inventory-shipment-sku-subtitle {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.inventory-shipment-sku-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}

.inventory-shipment-sku-summary > div {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel-2);
}

.inventory-shipment-sku-summary span,
.inventory-shipment-sku-summary b {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.inventory-shipment-sku-summary span {
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 11.5px;
}

.inventory-shipment-sku-summary b {
  color: var(--ink);
  font-size: 14px;
}

.inventory-shipment-sku-scroll {
  max-height: min(58vh, 520px);
}

.inventory-shipment-sku-modal .data-table td strong {
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
}

.inventory-shipment-sku-empty {
  margin: 12px 0 0;
}

.inventory-anomaly-text {
  color: var(--down);
  font-weight: 600;
  white-space: normal;
  min-width: 180px;
}

.inventory-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 18px;
}

.inventory-section-head h4 { margin: 0; }

.inventory-lead-editor {
  margin: 10px 0 14px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel-2);
}

.inventory-lead-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
}

.inventory-lead-row:last-of-type { border-bottom: none; }
.inventory-lead-row > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.inventory-lead-row strong { font-size: 12.5px; }
.inventory-lead-row span { color: var(--muted); font-size: 11.5px; }
.inventory-lead-row label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.inventory-lead-row input { width: 72px; height: 30px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 6px; font: inherit; }
.inventory-lead-actions { display: flex; justify-content: flex-end; margin-top: 8px; }

.purchase-followup-cell { width: 190px; min-width: 190px; max-width: 190px; }

.purchase-note {
  display: block;
  width: 178px;
  min-width: 178px;
  max-width: 178px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--ink-2);
  padding: 5px 7px;
  font: inherit;
  font-size: 11.5px;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.purchase-note:hover { border-color: var(--accent); color: var(--ink); }

.inventory-note-popover {
  position: fixed;
  z-index: 2200;
  max-height: 260px;
  overflow: auto;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  box-shadow: var(--shadow-lg);
  font-size: 12px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.detail-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.detail-metrics > div {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel-2);
}

.detail-metrics span { display: block; color: var(--muted); font-size: 11.5px; }
.detail-metrics b { display: block; margin-top: 2px; font-size: 18px; }

@media (max-width: 760px) {
  .inventory-search { width: 100%; }
  .inventory-source { width: 100%; margin-left: 0; }
  .inventory-table-wrap { max-height: none; }
  .detail-metrics { grid-template-columns: 1fr 1fr; }
}

/* ---------- 表格 ---------- */
.table-wrap {
  overflow-x: auto;
  overscroll-behavior-x: contain;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.data-table th {
  position: sticky;
  background: var(--panel-2);
  text-align: left;
  padding: 9px 12px;
  font-weight: 600;
  color: var(--ink-2);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  top: 0;
}

.data-table th .col-resize-handle {
  position: absolute;
  display: block;
  top: 0;
  right: 0;
  width: 6px;
  height: 100%;
  cursor: col-resize;
  pointer-events: auto;
  touch-action: none;
  z-index: 3;
}

.data-table th .col-resize-handle:hover {
  background: var(--accent);
  opacity: 0.35;
}

body.resizing-column {
  cursor: col-resize;
  user-select: none;
}

.data-table th.sortable {
  cursor: pointer;
  user-select: none;
}

.data-table th.sortable:hover {
  background: var(--accent-weak);
}

.data-table th .sort-indicator {
  display: inline-block;
  width: 0;
  height: 0;
  margin-left: 5px;
  vertical-align: middle;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--muted);
  opacity: 0.45;
}

.data-table th[aria-sort="asc"] .sort-indicator {
  border-top: none;
  border-bottom: 5px solid var(--accent);
  opacity: 1;
}

.data-table th[aria-sort="desc"] .sort-indicator {
  border-top: 5px solid var(--accent);
  opacity: 1;
}

.data-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--panel-2); }

.data-table .num { font-family: var(--font); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.data-table .rank-up { color: var(--ok); font-weight: 600; }
.data-table .rank-down { color: var(--down); font-weight: 600; }

.kw-table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #f5f4ef;
}

.cp-prod-thumb {
  width: 56px;
  height: 56px;
  flex: 0 0 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: #fff;
  color: var(--muted);
  padding: 2px;
}

.cp-prod-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.cp-prod-thumb svg {
  width: 20px;
  height: 20px;
}

.cp-summary-thumb {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: #fff;
  color: var(--muted);
  padding: 2px;
}

.cp-summary-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.cp-summary-thumb svg {
  width: 18px;
  height: 18px;
}

/* ---------- 产品档案：型号/花色分层表 ---------- */
.products-table { min-width: 1180px; }

.products-table .model-row {
  background: #eef4ff;
}

.products-table .model-row.is-expanded > td {
  border-bottom-color: #bfdbfe;
}

.products-table .model-row td,
.products-table .variant-row td {
  vertical-align: top;
}

.products-table .row-ops {
  display: flex;
  gap: 6px;
  white-space: nowrap;
}

.products-table .img-cell {
  width: 58px;
}

.products-table .prod-img {
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
  background: var(--panel);
  color: var(--muted);
}

.products-table .prod-img svg {
  width: 20px;
  height: 20px;
}

.products-table .prod-img.has-image {
  border-style: solid;
  border-color: var(--line);
  overflow: hidden;
}

.products-table .prod-img.has-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.products-table .cell-muted {
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 2px;
}

.products-table .color-summary {
  cursor: pointer;
  white-space: nowrap;
}

.products-table .color-summary-inner {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent-strong);
  font-weight: 600;
  font-size: 12px;
}

.products-table .color-summary-inner svg {
  width: 14px;
  height: 14px;
  color: var(--accent);
}

.products-table .color-summary:hover {
  text-decoration: underline;
}

.products-table .variant-row {
  background: var(--panel-2);
}

.products-table .variant-row:hover {
  background: #eef2f7;
}

.products-table .variant-label-cell .variant-label {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  width: 100%;
}

.products-table .variant-label-cell .variant-thumb {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--line-strong);
  border-radius: 5px;
  background: var(--panel);
  color: var(--muted);
  overflow: hidden;
}

.products-table .variant-label-cell .variant-thumb svg {
  width: 14px;
  height: 14px;
}

.products-table .variant-label-cell .variant-thumb.has-image {
  border-style: solid;
  border-color: var(--line);
}

.products-table .variant-label-cell .variant-thumb.has-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.products-table .variant-label-cell input {
  flex: 1;
  min-width: 62px;
}

.products-table .variant-skip {
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

/* 固定列：产品图片 ~ 花色 */
.products-table th.col-fixed,
.products-table td.col-fixed {
  position: sticky;
  z-index: 2;
  background: var(--panel);
}

.products-table tr.model-row td.col-fixed {
  background: #eef4ff;
}

.products-table tr.variant-row td.col-fixed {
  background: var(--panel-2);
}

.products-table th.sortable {
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

.products-table th.sortable:hover {
  color: var(--accent-strong);
}

.products-table th.sortable .sort-icon {
  width: 12px;
  height: 12px;
  margin-left: 4px;
  color: var(--muted);
  vertical-align: -1px;
}

.products-table th.sortable[aria-sort="ascending"] .sort-icon,
.products-table th.sortable[aria-sort="descending"] .sort-icon {
  color: var(--accent-strong);
}

.products-table thead th.col-fixed {
  top: 0;
  z-index: 5;
  background: var(--panel-2);
}

.products-table th.col-action,
.products-table td.col-action {
  position: sticky;
  right: 0;
  z-index: 4;
  background: var(--panel);
  box-shadow: -5px 0 10px rgba(15, 23, 42, 0.06);
}

.products-table tr.model-row td.col-action {
  background: #eef4ff;
}

.products-table tr.variant-row td.col-action {
  background: var(--panel-2);
}

.products-table thead th.col-action {
  top: 0;
  z-index: 7;
  background: var(--panel-2);
}

/* ---------- 文件列表 ---------- */
.file-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  background: var(--panel);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.file-row:hover { border-color: var(--accent); box-shadow: var(--shadow); }

.file-row .file-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  background: var(--accent-weak);
  color: var(--accent);
}

.file-row .file-icon.xlsx { background: #f0fdf4; color: var(--ok); }
.file-row .file-icon.md { background: var(--warn-weak); color: var(--warn); }
.file-row .file-icon.csv { background: var(--panel-2); color: var(--ink-2); }

.file-row .file-info { flex: 1; min-width: 0; }
.file-row .file-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .file-meta { font-size: 11.5px; color: var(--muted); }

.file-row .file-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ---------- 榜单图片墙 ---------- */
.rank-image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 14px;
}

.rank-image-card {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--panel);
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}

.rank-image-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.rank-img-wrap {
  position: relative;
  aspect-ratio: 1;
  background: var(--panel-2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.rank-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.rank-badge {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.75);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  border-radius: 7px;
  z-index: 2;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.28);
}

.rank-badge.top1 { background: #f59e0b; }
.rank-badge.top2 { background: #94a3b8; }
.rank-badge.top3 { background: #b45309; }

.rank-img-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--line-strong);
  background: var(--panel-2);
}

.rank-img-placeholder svg { width: 28px; height: 28px; }

.rank-img-info {
  padding: 10px 12px 12px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}

.rank-img-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
  margin-top: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 35px;
}
.rank-img-price { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: 0; }
.rank-img-sales { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.rank-img-rating { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.rank-img-listed { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

/* ---------- 上传区 ---------- */
.upload-zone {
  border: 2px dashed var(--line-strong);
  border-radius: var(--radius);
  padding: 32px 20px;
  text-align: center;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.2s;
  background: var(--panel-2);
}

.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-weak);
  color: var(--accent-strong);
}

.upload-zone svg { width: 36px; height: 36px; margin-bottom: 10px; color: var(--muted); }
.upload-zone:hover svg { color: var(--accent); }
.upload-zone p { font-size: 13.5px; }
.upload-zone .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ---------- 标签 ---------- */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--panel-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
}

.tag.blue { background: var(--accent-alt-weak); color: var(--accent-alt); border-color: #b8d3e4; }
.tag.green { background: var(--ok-weak); color: var(--ok); border-color: #bbf7d0; }
.tag.amber { background: var(--warn-weak); color: var(--warn); border-color: #fde68a; }
.tag.red { background: var(--down-weak); color: var(--down); border-color: #fecaca; }

/* ---------- 多选筛选器 ---------- */
.multi-filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: flex-start;
  margin-top: 12px;
}

.multi-filter {
  position: relative;
}

.multi-filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink-2);
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
}

.multi-filter-btn:hover {
  border-color: var(--accent);
  color: var(--accent-strong);
}

.multi-filter-btn svg {
  width: 14px;
  height: 14px;
  color: var(--muted);
}

.multi-filter-count {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--accent-weak);
  color: var(--accent-strong);
  font-size: 11px;
  font-weight: 600;
}

.multi-filter-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 40;
  width: 230px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  padding: 8px;
}

.multi-filter-panel::before {

<script>
/* Shared marketplace scope for the workbench and embedded apps. */
window.WorkbenchSites = (function () {
  "use strict";

  const SITES = ["US", "CA", "DE", "UK"];
  const META = {
    US: { label: "美国", domain: "amazon.com", currency: "$" },
    CA: { label: "加拿大", domain: "amazon.ca", currency: "CA$" },
    DE: { label: "德国", domain: "amazon.de", currency: "€" },
    UK: { label: "英国", domain: "amazon.co.uk", currency: "£" },
  };
  const SET = new Set(SITES);

  function normalize(value) {
    const site = String(value || "").trim().toUpperCase();
    return site === "GB" ? "UK" : site;
  }

  function includes(value) {
    return SET.has(normalize(value));
  }

  function productUrl(asin, siteValue) {
    if (!asin) return "#";
    const site = includes(siteValue) ? normalize(siteValue) : "US";
    return `https://www.${META[site].domain}/dp/${encodeURIComponent(String(asin).trim())}`;
  }

  function label(value) {
    const site = normalize(value);
    return META[site] ? `${site} · ${META[site].label}` : String(value || "");
  }

  function currencySymbol(value) {
    const site = includes(value) ? normalize(value) : "US";
    return META[site].currency;
  }

  return { SITES, META, normalize, includes, productUrl, label, currencySymbol };
})();

</script>

/* ============================================================
   亚马逊运营工作台 - 主应用控制器
   模块一：市场调研（榜单分析 / 热搜词分析 / 竞品分析）
   模块二：Listing 编辑（规划中）
   模块三：广告智研舱
   ============================================================ */

(function () {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtSize(bytes) {
    if (bytes == null) return "-";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(2) + " MB";
  }

  function fmtNum(n, d) {
    if (n == null || isNaN(n)) return "-";
    return Number(n).toLocaleString("zh-CN", { maximumFractionDigits: d == null ? 2 : d });
  }

  function toast(msg, type) {
    const root = $("#toast-root");
    const el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    const icon = type === "success" ? "check-circle" : type === "error" ? "alert-circle" : "info";
    el.innerHTML = `<i data-lucide="${icon}"></i><span>${esc(msg)}</span>`;
    root.appendChild(el);
    if (window.lucide) lucide.createIcons();
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transition = "opacity 0.3s";
      setTimeout(() => el.remove(), 300);
    }, 3000);
  }

  let inventorySnapshotPromise = null;

  async function loadInventorySnapshot() {
    if (!inventorySnapshotPromise) {
      inventorySnapshotPromise = (async () => {
        const encoded = window.__INVENTORY_SNAPSHOT_DATA_B64__;
        if (!encoded) throw new Error("库存快照数据缺失");
        const binary = atob(encoded);
        const buffer = Uint8Array.from(binary, (char) => char.charCodeAt(0)).buffer;
        const bytes = new Uint8Array(buffer);
        let stream = new Blob([bytes]).stream();
        if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
          stream = stream.pipeThrough(new DecompressionStream("gzip"));
        }
        return JSON.parse(await new Response(stream).text());
      })().catch((error) => {
        inventorySnapshotPromise = null;
        throw error;
      });
    }
    return inventorySnapshotPromise;
  }

  async function api(path, options) {
    if (window.__INVENTORY_SNAPSHOT_MODE__) {
      if (path === "/api/inventory-monitor" || path.startsWith("/api/inventory-monitor?")) {
        return loadInventorySnapshot();
      }
      if (path === "/api/inventory-monitor-fba-lead") return { ok: true };
      if (path === "/api/workspace") return { workspace: "团队展示快照", exists: true };
      if (path === "/api/inventory-monitor-sync" || path === "/api/inventory-monitor-sync-status") {
        return { ok: false, needLogin: false, message: "团队展示快照为只读" };
      }

    const resp = await fetch(path, options);
    const data = await resp.json().catch(() => ({}));

  function tableMatrix(table, options = {}) {
    if (!table) return { headers: [], rows: [] };
    const headerRows = Array.from(table.tHead?.rows || []);
    const headerGrid = [];
    headerRows.forEach((row, rowIndex) => {
      headerGrid[rowIndex] ||= [];
      let columnIndex = 0;
      Array.from(row.cells).forEach((cell) => {
        while (headerGrid[rowIndex][columnIndex] != null) columnIndex += 1;
        const rowSpan = Math.max(1, cell.rowSpan || 1);
        const colSpan = Math.max(1, cell.colSpan || 1);
        const label = String(cell.innerText || cell.textContent || "").trim().replace(/\s+/g, " ");
        for (let rowOffset = 0; rowOffset < rowSpan; rowOffset += 1) {
          const targetRow = rowIndex + rowOffset;
          headerGrid[targetRow] ||= [];
          for (let columnOffset = 0; columnOffset < colSpan; columnOffset += 1) {
            headerGrid[targetRow][columnIndex + columnOffset] = label;
          }
        }
        columnIndex += colSpan;
      });
    });
    const columnCount = Math.max(
      0,
      ...headerGrid.map((row) => row.length),
      ...Array.from(table.tBodies || []).flatMap((body) => Array.from(body.rows).map((row) => row.cells.length)),
    );
    const allHeaders = Array.from({ length: columnCount }, (_, columnIndex) => {
      const labels = [];
      headerGrid.forEach((row) => {
        const label = row[columnIndex];
        if (label && labels[labels.length - 1] !== label) labels.push(label);
      });
      return labels.join(" · ") || `列${columnIndex + 1}`;
    });
    const columns = Array.from({ length: columnCount }, (_, index) => index)
      .filter((index) => !options.columnFilter || options.columnFilter(allHeaders[index], index));
    const headers = columns.map((index) => allHeaders[index]);

    const cellText = (cell) => {
      if (!cell || cell.hidden) return "";
      if (options.ignore?.(cell)) return "";
      const notePreview = cell.querySelector?.(".pf-note-preview-text");
      if (notePreview) {
        const text = String(notePreview.textContent || "").trim();
        return text === "点击填写" ? "" : text;
      }
      const editor = cell.querySelector?.("input, select, textarea");
      if (editor) {
        if (editor instanceof HTMLInputElement && editor.type === "checkbox") return editor.checked ? "是" : "";
        if (editor instanceof HTMLSelectElement) return editor.selectedOptions?.[0]?.textContent?.trim() || editor.value || "";
        return String(editor.value || "").trim();
      }
      return String(cell.innerText || cell.textContent || "").trim();
    };

    const bodyRows = options.bodySelector
      ? Array.from(table.querySelectorAll(options.bodySelector))
      : Array.from(table.tBodies || []).flatMap((body) => Array.from(body.rows));
    const rows = bodyRows
      .filter((row) => !options.rowFilter || options.rowFilter(row))
      .map((row) => {
        const cells = Array.from(row.cells);
        return columns.map((index) => cellText(cells[index]));
      });
    return { headers, rows };
  }

  function downloadTableCsv(table, filename, options = {}) {
    const matrix = tableMatrix(table, options);
    if (!matrix.rows.length) return false;
    const lines = [
      matrix.headers.map(csvCell),
      ...matrix.rows.map((row) => row.slice(0, matrix.headers.length).map(csvCell)),
    ];
    const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 0);
    return true;
  }

  /* ---------- 模块加载 ---------- */
  /* cache-busting：文件名后拼构建时间戳，确保每次会话强刷拉取最新模块，
     避免浏览器/服务端缓存导致「代码已改、页面仍跑旧逻辑」。 */
  const BUILD_TS = Date.now();
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "t=" + BUILD_TS;
      s.onload = resolve;
      s.onerror = () => reject(new Error("加载失败: " + src));
      document.head.appendChild(s);
    });
  }

  async function ensureViewModule(name) {
    const deps = VIEW_MODULES[name];
    if (!deps) return;
    const missing = deps.filter((src) => !loadedScripts.has(src));
    for (const src of missing) {
      if (!scriptLoads[src]) {
        scriptLoads[src] = loadScript(src)
          .then(() => loadedScripts.add(src))
          .catch((e) => {
            delete scriptLoads[src];
            throw e;
          });
      }
      await scriptLoads[src];
    }
  }
